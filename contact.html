<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<meta content="#070e1c" name="theme-color"/>
<meta content="noindex, follow" name="robots"/>
<meta content="Sudhanshu Shukla" name="author"/>
<title>Contact | Sudhanshu Shukla</title>
<link href="/assets/favicon.svg" rel="icon" type="image/svg+xml"/>
<script>
  /* Embedded in index.html via iframe? Drop the page chrome so the form blends into the parent section. */
  if (window.self !== window.top) document.documentElement.classList.add('is-embedded');
</script>
<style>
  :root {
    --bg: #070e1c; --panel: #0e1e33; --panel-2: #132841; --edge: #29415d;
    --text: #eef5ff; --muted: #aabed5; --dim: #829bb6;
    --cyan: #7be2f0; --violet: #b3a9ff; --green: #87e4c7; --focus: #95eaff; --danger: #ffa3b4;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text); background: var(--bg); line-height: 1.6;
    -webkit-font-smoothing: antialiased; padding: clamp(32px, 6vw, 72px) 20px;
  }
  .is-embedded body { background: transparent; padding: 2px; }
  .page { max-width: 640px; margin: 0 auto; }
  .is-embedded .page { max-width: none; }
  .is-embedded .standalone-only { display: none; }

  .standalone-head { margin-bottom: 28px; }
  .back-link { display: inline-block; margin-bottom: 28px; font-size: 13px; color: var(--muted); text-decoration: none; }
  .back-link:hover, .back-link:focus-visible { color: var(--text); }
  .kicker { margin: 0 0 10px; font-size: 11px; font-weight: 700; letter-spacing: .18em; color: var(--cyan); }
  h1 { margin: 0; font-size: clamp(28px, 5vw, 40px); line-height: 1.15; letter-spacing: -.02em; }

  .card {
    border: 1px solid var(--edge); border-radius: 20px; padding: clamp(22px, 4vw, 32px);
    background: linear-gradient(145deg, var(--panel-2) 0%, var(--panel) 55%, #0a1628 100%);
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  label { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  input, textarea {
    width: 100%; font: inherit; font-size: 15px; color: var(--text);
    background: rgba(7, 14, 28, .72); border: 1px solid var(--edge); border-radius: 12px;
    padding: 13px 14px; transition: border-color .15s ease, box-shadow .15s ease; touch-action: manipulation;
  }
  textarea { min-height: 150px; resize: vertical; }
  input::placeholder, textarea::placeholder { color: var(--dim); opacity: 1; }
  input:hover, textarea:hover { border-color: #3a5878; }
  input:focus-visible, textarea:focus-visible { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px rgba(149, 234, 255, .22); }
  input:user-invalid, textarea:user-invalid { border-color: var(--danger); }

  /* Formspree honeypot: hidden from people, filled in by bots. */
  .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }

  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 18px; margin-top: 4px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 24px;
    border: 0; border-radius: 12px; cursor: pointer; font: inherit; font-size: 13px; font-weight: 700; letter-spacing: .03em;
    color: #06111f; background: linear-gradient(135deg, var(--cyan), var(--violet));
    transition: transform .15s ease, filter .15s ease;
  }
  .btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
  .btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  .btn[disabled] { opacity: .65; cursor: progress; transform: none; filter: none; }
  .note { margin: 0; font-size: 12.5px; color: var(--dim); }

  .status { margin: 18px 0 0; padding: 12px 14px; border-radius: 12px; font-size: 14px; border: 1px solid transparent; }
  .status:empty { display: none; }
  .status[data-state="success"] { color: var(--green); background: rgba(135, 228, 199, .08); border-color: rgba(135, 228, 199, .32); }
  .status[data-state="error"] { color: var(--danger); background: rgba(255, 163, 180, .08); border-color: rgba(255, 163, 180, .32); }

  @media (max-width: 560px) { .row { grid-template-columns: 1fr; } .btn { width: 100%; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
</head>
<body>
<main class="page">
  <header class="standalone-only standalone-head">
    <a class="back-link" href="/">← Back to portfolio</a>
    <p class="kicker">GET IN TOUCH</p>
    <h1>Contact Sudhanshu Shukla</h1>
  </header>

  <!-- Formspree endpoint for this site's contact form. Submissions are emailed to the address on the Formspree account. -->
  <form action="https://formspree.io/f/mzeraprg" class="card" id="contact-form" method="POST" target="_top">
    <input name="_subject" type="hidden" value="New message from su394611-del.github.io"/>
    <div class="row">
      <div class="field">
        <label for="cf-name">Name</label>
        <input autocomplete="name" id="cf-name" maxlength="100" name="name" placeholder="Your name" required type="text"/>
      </div>
      <div class="field">
        <label for="cf-email">Email</label>
        <input autocomplete="email" id="cf-email" maxlength="200" name="email" placeholder="you@company.com" required type="email"/>
      </div>
    </div>
    <div class="field">
      <label for="cf-message">Message</label>
      <textarea id="cf-message" maxlength="5000" name="message" placeholder="What would you like to discuss?" required rows="6"></textarea>
    </div>
    <div aria-hidden="true" class="hp">
      <label for="cf-gotcha">Leave this field empty</label>
      <input autocomplete="off" id="cf-gotcha" name="_gotcha" tabindex="-1" type="text"/>
    </div>
    <div class="actions">
      <button class="btn" type="submit"><span class="btn-label">Send message</span><span aria-hidden="true">→</span></button>
      <p class="note">Sent via Formspree. Your email is only used to reply to you.</p>
    </div>
    <p aria-live="polite" class="status" id="cf-status" role="status"></p>
  </form>
</main>

<script>
(function () {
  'use strict';
  var form = document.getElementById('contact-form');
  var status = document.getElementById('cf-status');
  var button = form.querySelector('button[type="submit"]');
  var label = button.querySelector('.btn-label');
  var subject = form.querySelector('input[name="_subject"]');
  var baseSubject = subject.defaultValue;
  var embedded = window.self !== window.top;

  /* Tell index.html how tall the form is so the iframe never scrolls. */
  function postHeight() {
    if (!embedded) return;
    try {
      var height = Math.ceil(document.body.getBoundingClientRect().height);
      window.parent.postMessage({ type: 'contact-frame:height', height: height }, '/');
    } catch (e) { /* parent on another origin: keep the default iframe height */ }
  }

  function setStatus(message, state) {
    status.textContent = message;
    if (state) status.setAttribute('data-state', state); else status.removeAttribute('data-state');
    postHeight();
  }

  function setBusy(busy) {
    button.disabled = busy;
    label.textContent = busy ? 'Sending…' : 'Send message';
    if (busy) form.setAttribute('aria-busy', 'true'); else form.removeAttribute('aria-busy');
  }

  form.addEventListener('submit', function (event) {
    if (!window.fetch || !window.FormData) return; /* very old browser: plain POST to Formspree */
    event.preventDefault();

    /* Split so a find-and-replace of the placeholder in this file doesn't also rewrite this check. */
    if (form.action.indexOf('YOUR_' + 'FORM_ID') !== -1) {
      setStatus('This form isn’t connected yet. Add your Formspree form ID to contact.html.', 'error');
      return;
    }

    var nameField = form.elements.namedItem('name');
    var name = nameField ? nameField.value.trim() : '';
    subject.value = name ? baseSubject + ' — ' + name : baseSubject;

    setBusy(true);
    setStatus('', null);

    fetch(form.action, { method: 'POST', body: new FormData(form), headers: { Accept: 'application/json' } })
      .then(function (response) {
        if (response.ok) {
          form.reset();
          setStatus('Thanks, your message has been sent. I’ll get back to you by email.', 'success');
          return;
        }
        return response.json().catch(function () { return {}; }).then(function (data) {
          var detail = data && Array.isArray(data.errors)
            ? data.errors.map(function (e) {
                if (!e || !e.message) return '';
                var field = e.field ? e.field.charAt(0).toUpperCase() + e.field.slice(1) + ' ' : '';
                return field + e.message + '.';
              }).filter(Boolean).join(' ')
            : '';
          setStatus(detail || 'Sorry, your message couldn’t be sent. Please try again in a moment.', 'error');
        });
      })
      .catch(function () {
        setStatus('Network error. Please check your connection and try again.', 'error');
      })
      .then(function () { setBusy(false); });
  });

  if (embedded) {
    if ('ResizeObserver' in window) new ResizeObserver(postHeight).observe(document.body);
    window.addEventListener('load', postHeight);
    window.addEventListener('resize', postHeight);
    postHeight();
  }
})();
</script>
</body>
</html>

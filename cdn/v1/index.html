<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Lab CDN Demo</title>
  <style>
    :root { color-scheme: light dark; font: 100%/1.55 system-ui, sans-serif; }
    body { max-width: 46rem; margin: 3rem auto; padding: 0 1.25rem; }
    h1 { line-height: 1.1; }
    li { margin-block: .75rem; overflow-wrap: anywhere; }
    button { padding: .55rem .9rem; font: inherit; cursor: pointer; }
    img { vertical-align: middle; margin-inline-end: .5rem; }
  </style>
</head>
<body>
  <main>
    <h1>AI Lab CDN demo</h1>
    <p>This page loads a sample of AI Lab assets through jsDelivr. The main site and project pages still use their existing asset URLs.</p>
    <div id="demo">
      <p>The Vue demo is loading. You can also open the <a href="./assets.js">asset catalog</a>.</p>
    </div>
    <noscript><p>Enable JavaScript to run the asset checks.</p></noscript>
  </main>
  <script src="/assets/vue-3.5.13.global.prod.js"></script>
  <script type="module">
    import { assets, revision } from "./assets.js";
    import { createCdnAssetList } from "./vue.js";

    const { createApp, h, ref } = window.Vue;
    const CdnAssetList = createCdnAssetList(h);
    const files = Object.values(assets);

    createApp({
      setup() {
        const busy = ref(false);
        const results = ref([]);

        async function checkAssets() {
          if (busy.value) return;
          busy.value = true;
          results.value = [];
          results.value = await Promise.all(files.map(async (url) => {
            const name = url.split("/").pop();
            try {
              const response = await fetch(url, {
                credentials: "omit",
                signal: AbortSignal.timeout(10000),
              });
              if (!response.ok) return name + " — HTTP " + response.status;
              const body = await response.arrayBuffer();
              return name + " — HTTP " + response.status + " · " + body.byteLength.toLocaleString() + " bytes";
            } catch {
              return name + " — request failed";
            }
          }));
          busy.value = false;
        }

        return () => h("div", [
          h("p", [h("img", { src: assets.favicon, width: 32, height: 32, alt: "" }), "Live icon loaded from jsDelivr"]),
          h("p", ["Asset revision ", h("code", revision.slice(0, 12))]),
          h(CdnAssetList),
          h("button", { type: "button", disabled: busy.value, onClick: checkAssets }, "Check CDN assets"),
          h("div", { "aria-live": "polite" },
            busy.value ? "Checking…" :
              results.value.length ? [h("ul", results.value.map((result) => h("li", { key: result }, result)))] : []
          ),
        ]);
      },
    }).mount("#demo");
  </script>
</body>
</html>
